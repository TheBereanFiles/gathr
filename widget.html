<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gathr at a glance</title>
<link rel="manifest" href="widget.webmanifest"><meta name="theme-color" content="#165D63"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gathr Glance"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FAF7F2;font-family:Inter,system-ui,sans-serif;color:#243438;padding:calc(env(safe-area-inset-top) + 20px) 18px 24px}.w{max-width:400px;margin:0 auto;background:#E4EDE5;color:#243438;border:1px solid #CFDDD1;border-radius:24px;padding:22px}.k{font:700 12px Inter;letter-spacing:.08em;color:#165D63}h1{font:700 28px Fraunces,serif;margin:8px 0 4px}.p{margin:4px 0;font-size:16px}a.b{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:14px;font-weight:700;margin-top:12px}.r{background:#165D63;color:#fff}.o{background:#fff;color:#165D63;border:1px solid #CFDDD1}.s{text-align:center;color:#596B70;font-size:13px;margin-top:14px}</style></head>
<body><div class="w"><div class="k">NEXT GATHERING</div><h1 id="when">…</h1><div class="p" id="place"></div><div class="p" id="host" style="opacity:.9"></div><div class="p" id="pass" style="margin-top:12px;font-weight:600"></div><a class="b r" id="read" target="_blank">📖 Read</a><a class="b o" href="./?view=today">Open Gathr ›</a></div><div class="s" id="st">Pin this page: Share ⬆︎ › Add to Home Screen (iPhone) or ⋮ › Add to Home screen (Android)</div>
<script src="common.js"></script><script>
const TRB={BSB:1,KJV:'KJV',WEB:'WEB',ASV:'ASV',YLT:'YLT',DARBY:'DARBY',DRA:'DRA'};
const BK={Mark:'MRK',Matthew:'MAT',Acts:'ACT',James:'JAS',Philippians:'PHP',Luke:'LUK',John:'JHN',Psalm:'PSA',Psalms:'PSA'};
function url(p){const ref=(p||'').split(',')[0].trim(),t=localStorage.gathr_tr||'BSB';if(t!='BSB')return 'https://www.biblegateway.com/passage/?search='+encodeURIComponent(ref)+'&version='+t;
 const m=ref.match(/^(\d?\s?[A-Za-z]+)\s+(\d+)(?::(\d+(?:-\d+)?))?/);if(!m||!BK[m[1]])return 'https://www.bible.com/bible/3034/';return `https://www.bible.com/bible/3034/${BK[m[1]]}.${m[2]}${m[3]?'.'+m[3]:''}.BSB`}
function fmt(e){const d=new Date(e.date+'T'+(e.time||'00:00'));return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
let ACC=null;
function show(doc){try{ACC=doc.acc?JSON.parse(doc.acc.v):ACC;const v=JSON.parse(doc.ev.v);const d=new Date(),today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const G=v.filter(e=>e.date>=today).sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1)[0];if(!G){document.getElementById('when').textContent='No gatherings yet';place.textContent='Add your first gathering in the app.';host.textContent='';pass.textContent='';read.style.display='none';return}read.style.display='';
 document.getElementById('when').textContent=fmt(G);place.textContent='📍 '+G.place+(G.addr?', '+G.addr:'');host.textContent=G.host?'🏠 '+G.host:'';pass.textContent='📖 '+(G.pass||'Passage TBA');read.href=url(G.pass);read.textContent='📖 Read ('+(localStorage.gathr_tr||'BSB')+')'}catch(e){}}
async function load(){const l=localDoc();if(l.ev)show(l);try{const d=await storeGet();if(d.ev){saveLocalDoc(Object.assign(l,d));show(d)}}catch(e){st.textContent='Offline: showing last saved info'}gateCheck(()=>ACC||SEED_ACC,null)}
load();setInterval(load,15000);
</script></body></html>
